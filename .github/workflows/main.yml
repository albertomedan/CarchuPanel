name: Compilar Executable Portable
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # La version mas estable para Tkinter
    - name: Instalar Empaquetador
      run: pip install pyinstaller
    - name: Crear Unico Archivo Portable
      run: pyinstaller --onefile --noconsole --uac-admin Carchu_Optimizator_v2.py
    - name: Subir Resultado Final
      uses: actions/upload-artifact@v4
      with:
        name: CarchuPanel_Portable
        path: dist/Carchu_Optimizator_v2.exe
